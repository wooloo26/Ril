[package]
name = "ril-rt-static"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "ril_rt"
crate-type = ["staticlib"]

[dependencies]
ril_rt_impl = { package = "ril-rt", path = "../../crates/ril-rt" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1

[package]
name = "ril-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ril-source = { path = "../crates/ril-source" }
ril-syntax = { path = "../crates/ril-syntax" }
ril-hir = { path = "../crates/ril-hir" }
ril-sema = { path = "../crates/ril-sema" }
ril-mir = { path = "../crates/ril-mir" }
ril-codegen = { path = "../crates/ril-codegen" }
ril-driver = { path = "../crates/ril-driver" }
ril-rt = { path = "../crates/ril-rt" }
ril-test = { path = "../crates/ril-test" }

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
doc = false

[[bin]]
name = "fuzz_type_eval"
path = "fuzz_targets/fuzz_type_eval.rs"
doc = false

[[bin]]
name = "fuzz_access_horn"
path = "fuzz_targets/fuzz_access_horn.rs"
doc = false

[[bin]]
name = "fuzz_opt_equiv"
path = "fuzz_targets/fuzz_opt_equiv.rs"
doc = false

[[bin]]
name = "fuzz_mir_verify"
path = "fuzz_targets/fuzz_mir_verify.rs"
doc = false

[[bin]]
name = "fuzz_rt_graph"
path = "fuzz_targets/fuzz_rt_graph.rs"
doc = false

[[bin]]
name = "fuzz_fmt"
path = "fuzz_targets/fuzz_fmt.rs"
doc = false

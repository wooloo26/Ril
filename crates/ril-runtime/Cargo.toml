[package]
name = "ril-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[dependencies]
ril-runtime-api.workspace = true
ril-text-format.workspace = true
serde_json.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
sha2.workspace = true
getrandom.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "try_close", "stdio", "rand"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_Environment", "Win32_System_IO", "Win32_System_Console", "Win32_System_WindowsProgramming", "Wdk_Foundation"] }

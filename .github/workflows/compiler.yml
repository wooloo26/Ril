name: Ril compiler

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compiler:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stage: [m0, m1, m2, m3]
    env:
      RIL_TEST_STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run -p ril-test --locked
      - if: matrix.stage == 'm1'
        run: cargo run -p ril-cli --locked -- test --sync-spec-md

  runtime:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      RIL_GC_STRESS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo miri test -p ril-rt-core --locked

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
      - run: lake -d formal build horn-oracle access-check
      - run: formal/.lake/build/bin/access-check
      - run: cargo test -p ril-test --test interfaces --locked
        env:
          RIL_HORN_ORACLE: ${{ github.workspace }}/formal/.lake/build/bin/horn-oracle

name: Ril compiler

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compiler:
    runs-on: ubuntu-latest
    env:
      RIL_GC_STRESS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p ril-cli --bin ril -- fmt --check std examples
      - run: cargo nextest run --workspace --locked
      - run: cargo nextest run -p ril-test --test suites --locked
        env:
          RIL_OPT_STACK_PROMOTE: '1'
      - run: cargo run --locked -p ril-cli --bin ril -- run examples/hello
      - run: cargo run --locked -p ril-cli --bin ril -- test --sync-spec-md --stage parse
      - run: cargo run --locked -p ril-cli --bin ril -- test --sync-spec-md --stage access
      - run: cargo nextest run -p ril-test --locked --stress-count 10 -E 'test(/^concurrency_deterministic::/)'

  runtime:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      RIL_GC_STRESS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo miri test -p ril-rt --locked
      - run: cargo test -p ril-rt --target x86_64-unknown-linux-gnu --locked
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
      - run: lake -d formal build horn-oracle access-check audit
      - run: formal/.lake/build/bin/access-check
      - run: formal/.lake/build/bin/audit
      - run: cargo test -p ril-test --test interfaces --locked
        env:
          RIL_HORN_ORACLE: ${{ github.workspace }}/formal/.lake/build/bin/horn-oracle

[package]
name = "ril"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "ril"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "ril"
path = "src/main.rs"

[[bin]]
name = "ril-commit-msg"
path = "src/bin/commit-msg.rs"

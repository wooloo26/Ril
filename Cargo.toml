[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/ril-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
ril-compiler-core = { path = "crates/ril-compiler-core" }
ril-syntax = { path = "crates/ril-syntax" }
ril-compiler = { path = "crates/ril-compiler" }
ril-ir = { path = "crates/ril-ir" }
ril-codegen = { path = "crates/ril-codegen" }
ril-codegen-cranelift = { path = "crates/ril-codegen-cranelift" }
ril-runtime-api = { path = "crates/ril-runtime-api" }
ril-test = { path = "crates/ril-test" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rowan = "0.17"
salsa = "0.28.5"
regex = "1.13"
tempfile = "3.27"
proptest = { version = "1.11", default-features = false, features = ["std"] }
target-lexicon = "0.13"
cranelift-codegen = { version = "0.136", default-features = false, features = ["std", "unwind", "x86"] }
cranelift-frontend = "0.136"
cranelift-module = "0.136"
cranelift-object = "0.136"
object = { version = "0.40", default-features = false, features = ["read", "std"] }
junction = { version = "2.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = 1
